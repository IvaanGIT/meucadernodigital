<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Portal</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); }

    .nav-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .hero {
      text-align: center;
      padding: 4rem 1rem 2rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .hero p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      border: 1px solid #334155;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .card h3 { margin-bottom: 0.5rem; }
    .card p { color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Estudei Portal</div>
    <button class="nav-btn">Sign In</button>
  </header>

  <main>
    <section class="hero">
      <h1>Master Your Studies</h1>
      <p>Access interactive flashcards, track your course progress, and ace your exams.</p>
    </section>

    <section class="grid">
      <div class="card">
        <h3>📚 Flashcards</h3>
        <p>Review key terms and practice active recall daily.</p>
      </div>
      <div class="card">
        <h3>⏱️ Study Timer</h3>
        <p>Stay focused using Pomodoro study blocks.</p>
      </div>
      <div class="card">
        <h3>📊 Analytics</h3>
        <p>Track progress metrics across your courses.</p>
      </div>
    </section>
  </main>

</body>
</html>
